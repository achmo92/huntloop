# Two independently-versioned migration histories in one repo.
#   alembic --name main_db          upgrade head
#   alembic --name credentials_db   upgrade head
#
# `sqlalchemy.url` is deliberately left EMPTY in both sections. Each env.py
# sets it at runtime from huntloop.config.load_config(), which is what makes
# OPS-04 true: changing DATABASE_URL alone repoints the migrations, with no
# edit to this file and no second config source to keep in sync.

[alembic]
# Present only so a bare `alembic` invocation fails loudly rather than
# silently migrating the wrong store. Always pass --name.
script_location = migrations/main
sqlalchemy.url =

[main_db]
script_location = migrations/main
sqlalchemy.url =

[credentials_db]
script_location = migrations/credentials
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
