# Phase 1 stack: migrations plus a dev probe.
# The `app` service uses the same image and depends on the `migrate` service with
# `service_completed_successfully`, NOT as a service that migrates itself. Running
# `alembic upgrade head` inside each container's own entrypoint would let two
# containers race to migrate the same database on a cold start; a one-shot service
# that must exit 0 first removes that race structurally rather than relying on locking.

x-huntloop-env: &huntloop-env
  HUNTLOOP_DATA_DIR: /data
  DATABASE_URL: ${DATABASE_URL:-sqlite:////data/huntloop.db}
  CREDENTIALS_DATABASE_URL: ${CREDENTIALS_DATABASE_URL:-sqlite:////data/credentials.db}
  HUNTLOOP_SECRET_KEY: ${HUNTLOOP_SECRET_KEY:?HUNTLOOP_SECRET_KEY must be set - generate one with openssl rand -base64 32}
  HUNTLOOP_OPENAI_BASE_URL: ${HUNTLOOP_OPENAI_BASE_URL:-https://api.openai.com/v1}
  # Optional passthrough — never required. The designed home for the API key is
  # the encrypted credentials store (key 'openai_api_key'); this env var is the
  # documented builder-only fallback (see config.resolve_llm_api_key).
  HUNTLOOP_OPENAI_API_KEY: ${HUNTLOOP_OPENAI_API_KEY:-}
  HUNTLOOP_TRIAGE_MODEL: ${HUNTLOOP_TRIAGE_MODEL:-gpt-4o-mini}
  HUNTLOOP_SCORING_MODEL: ${HUNTLOOP_SCORING_MODEL:-gpt-4o}
  HUNTLOOP_EXTRACTION_MODEL: ${HUNTLOOP_EXTRACTION_MODEL:-gpt-4o-mini}
  HUNTLOOP_MAX_EMPLOYER_CONCURRENCY: ${HUNTLOOP_MAX_EMPLOYER_CONCURRENCY:-5}
  HUNTLOOP_STALE_AFTER_EMPTY_RUNS: ${HUNTLOOP_STALE_AFTER_EMPTY_RUNS:-3}
  HUNTLOOP_RUN_AT: ${HUNTLOOP_RUN_AT:-08:00}
  HUNTLOOP_TIMEZONE: ${HUNTLOOP_TIMEZONE:-UTC}
  HUNTLOOP_RUN_SPEND_CAP_USD: ${HUNTLOOP_RUN_SPEND_CAP_USD:-}

services:
  migrate:
    build: .
    image: huntloop:local
    command:
      - sh
      - -c
      - "alembic --name main_db upgrade head && alembic --name credentials_db upgrade head"
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: "no"

  probe:
    build: .
    image: huntloop:local
    profiles: ["dev"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["python", "-m", "huntloop.dev_probe"]
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: "no"

  # The entrypoint is the CLI, the command is the default subcommand, so
  # `docker compose run --rm app <subcommand>` reads naturally.
  app:
    build: .
    image: huntloop:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["huntloop"]
    command: ["--help"]
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: "no"

  # The only long-running service in the stack. `restart: unless-stopped` (rather
  # than the one-shot services' `restart: "no"`) is what makes RUN-04 catch-up
  # observable: the container comes back after a host restart and APScheduler
  # finds a past-due next_run_time waiting in the shared data volume.
  # No browser, no display, no X server (OPS-02) -- the scheduler never renders;
  # the crawl path inside a run launches Chromium headless, as Phase 2 already does.
  scheduler:
    build: .
    image: huntloop:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["huntloop"]
    command: ["scheduler", "start"]
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
