# Phase 1 stack: migrations plus a dev probe.
# The `app` service uses the same image and depends on the `migrate` service with
# `service_completed_successfully`, NOT as a service that migrates itself. Running
# `alembic upgrade head` inside each container's own entrypoint would let two
# containers race to migrate the same database on a cold start; a one-shot service
# that must exit 0 first removes that race structurally rather than relying on locking.

x-huntloop-env: &huntloop-env
  HUNTLOOP_DATA_DIR: /data
  DATABASE_URL: ${DATABASE_URL:-sqlite:////data/huntloop.db}
  CREDENTIALS_DATABASE_URL: ${CREDENTIALS_DATABASE_URL:-sqlite:////data/credentials.db}
  HUNTLOOP_SECRET_KEY: ${HUNTLOOP_SECRET_KEY:?HUNTLOOP_SECRET_KEY must be set - generate one with openssl rand -base64 32}
  HUNTLOOP_OPENAI_BASE_URL: ${HUNTLOOP_OPENAI_BASE_URL:-https://api.openai.com/v1}
  HUNTLOOP_LLM_PROVIDER: ${HUNTLOOP_LLM_PROVIDER:-openai}
  # Optional passthrough — never required. The designed home for the API key is
  # the encrypted credentials store (key 'openai_api_key'); this env var is the
  # documented builder-only fallback (see config.resolve_llm_api_key).
  HUNTLOOP_OPENAI_API_KEY: ${HUNTLOOP_OPENAI_API_KEY:-}
  # T-04-02: hostname allowlist for the browser surface. Requests whose Host
  # is not in this list AND is not a bare IP literal are rejected 400
  # (DNS-rebinding defense). LAN access by IP (http://<machine-ip>:8000) works
  # with no change; set this when reaching the UI through a DNS name or
  # reverse proxy, e.g. HUNTLOOP_ALLOWED_HOSTS=localhost,127.0.0.1,huntloop.lan
  HUNTLOOP_ALLOWED_HOSTS: ${HUNTLOOP_ALLOWED_HOSTS:-localhost,127.0.0.1}
  # Optional escape hatch for deployments whose proxy rewrites Host: exact
  # origins that same-origin enforcement should also accept (comma-separated).
  HUNTLOOP_ALLOWED_ORIGINS: ${HUNTLOOP_ALLOWED_ORIGINS:-}
  # Required for local/LAN OpenAI-compatible endpoints such as the Codex gateway.
  HUNTLOOP_ALLOW_PRIVATE_ENDPOINT: ${HUNTLOOP_ALLOW_PRIVATE_ENDPOINT:-}
  HUNTLOOP_TRIAGE_MODEL: ${HUNTLOOP_TRIAGE_MODEL:-gpt-4o-mini}
  HUNTLOOP_SCORING_MODEL: ${HUNTLOOP_SCORING_MODEL:-gpt-4o}
  HUNTLOOP_EXTRACTION_MODEL: ${HUNTLOOP_EXTRACTION_MODEL:-gpt-4o-mini}
  HUNTLOOP_MAX_EMPLOYER_CONCURRENCY: ${HUNTLOOP_MAX_EMPLOYER_CONCURRENCY:-5}
  HUNTLOOP_STALE_AFTER_EMPTY_RUNS: ${HUNTLOOP_STALE_AFTER_EMPTY_RUNS:-3}
  HUNTLOOP_RUN_AT: ${HUNTLOOP_RUN_AT:-08:00}
  HUNTLOOP_TIMEZONE: ${HUNTLOOP_TIMEZONE:-UTC}
  HUNTLOOP_RUN_SPEND_CAP_USD: ${HUNTLOOP_RUN_SPEND_CAP_USD:-}

services:
  # T-04-07 follow-on: the runtime services run as non-root (uid 10001), but a
  # fresh named volume is created root-owned, so the non-root migrate/app cannot
  # write SQLite ("attempt to write a readonly database"). This one-shot root
  # container repairs `/data` ownership before migrate, so `docker compose up`
  # works on a fresh clone and on a pre-existing root-owned volume alike.
  init-perms:
    build: .
    image: huntloop:local
    user: "0:0"
    command: ["sh", "-c", "chown -R huntloop:huntloop /data"]
    volumes:
      - data:/data
    restart: "no"

  migrate:
    build: .
    image: huntloop:local
    depends_on:
      init-perms:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - "alembic --name main_db upgrade head && alembic --name credentials_db upgrade head"
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: "no"

  probe:
    build: .
    image: huntloop:local
    profiles: ["dev"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["python", "-m", "huntloop.dev_probe"]
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: "no"

  # The entrypoint is the CLI, the command is the default subcommand, so
  # `docker compose run --rm app <subcommand>` reads naturally.
  app:
    build: .
    image: huntloop:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["huntloop"]
    command: ["--help"]
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: "no"

  # The only long-running service in the stack. `restart: unless-stopped` (rather
  # than the one-shot services' `restart: "no"`) is what makes RUN-04 catch-up
  # observable: the container comes back after a host restart and APScheduler
  # finds a past-due next_run_time waiting in the shared data volume.
  # No browser, no display, no X server (OPS-02) -- the scheduler never renders;
  # the crawl path inside a run launches Chromium headless, as Phase 2 already does.
  scheduler:
    build: .
    image: huntloop:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["huntloop"]
    command: ["scheduler", "start"]
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: unless-stopped

  # The browser surface (OPS-01/UI-01): FastAPI serves the SPA baked into the
  # image's /app/web/dist same-origin at "/", plus the /api tree. Same image as
  # migrate/scheduler/app, so Playwright and the crawl path are available to
  # diagnostics/employer-fetch without a second build.
  # `--workers 1` is required, not a default to tune: multiple Uvicorn workers
  # each start their own in-process scheduler and duplicate runs silently
  # (STACK.md). The private-network trust model means binding 0.0.0.0 is the
  # point — any device on the host's network reaches it, with no auth ceremony.
  web:
    build: .
    image: huntloop:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: []
    command: ["uvicorn", "huntloop.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    environment: *huntloop-env
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
